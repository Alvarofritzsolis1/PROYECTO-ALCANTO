name: ALCANTO · pruebas de Streamlit

on:
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'alcanto_cloud/**'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/streamlit-tests.yml'
  pull_request:
    paths:
      - 'app.py'
      - 'alcanto_cloud/**'
      - 'requirements.txt'
      - 'tests/**'

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Verificar código
        run: python -m compileall -q app.py alcanto_cloud
      - name: Pruebas sin datos personales
        run: python -m unittest discover -s tests -v
