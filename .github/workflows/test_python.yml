name: Verificar aplicación ALCANTO

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: python -m pip install -r requirements.txt
      - name: Sintaxis
        run: python -m compileall -q app.py alcanto_cloud tests
      - name: Pruebas sin datos personales
        run: python -m unittest discover -s tests -v
